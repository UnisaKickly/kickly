# Modulo per i task svolti con un agente (linee guida "Agentic Workflow", passo 3).
# Ogni task ha la stessa forma: requisito, specifica, ambito e test frame.
# Lo stato del lavoro si segue su Jira; questa issue serve solo ad avviare gli
# agenti con le label di fase (fase:piano, fase:implementazione, fase:test).
name: Task per agente
description: Implementazione di un ticket Jira con la pipeline degli agenti
title: "KCK-: "
labels: ["task-agente"]
body:
  - type: markdown
    attributes:
      value: |
        Copia i campi dal ticket Jira (sezioni Specifica, Ambito, Verifica).
        Il titolo deve iniziare con la chiave Jira, es. `KCK-235: Creazione partita (Control)`:
        l'implementatore la usa per il nome del branch e della PR.
        Nessun agente parte all'invio: un PM aggiunge `fase:piano` quando il task e' pronto.

  - type: input
    id: jira
    attributes:
      label: Ticket Jira
      placeholder: KCK-235
    validations:
      required: true

  - type: input
    id: requisito
    attributes:
      label: Requisito e caso d'uso
      placeholder: RF_PAR_1, UC_PAR_1
    validations:
      required: true

  - type: textarea
    id: specifica
    attributes:
      label: Specifica (file da leggere)
      description: Solo i file che servono, con le classi rilevanti del class diagram.
      placeholder: |
        docs/rad/uc/UC_PAR_1_CreazionePartita.md
        docs/modelli/class.puml: Partita, Campo, Prenotazione
    validations:
      required: true

  - type: textarea
    id: ambito
    attributes:
      label: Ambito (file, classi e metodi da toccare)
      placeholder: lib/features/partite/domain/gestione_partita_control.dart
    validations:
      required: true

  - type: textarea
    id: verifica
    attributes:
      label: Test frame da coprire
      placeholder: TF_PAR_01-TF_PAR_06 di docs/test/cp_UC_PAR_1_UC_PAG_1.md
    validations:
      required: true

  - type: textarea
    id: criteri
    attributes:
      label: Criteri di accettazione (anche RNF)
      placeholder: "RNF_PRE_2: il voto e' registrato entro 10 secondi"

  - type: checkboxes
    id: pronto
    attributes:
      label: Prima di avviare la pipeline
      options:
        - label: Le dipendenze del ticket Jira sono mergiate in develop
          required: true
        - label: I modelli citati in Specifica esistono in docs/ e sono coerenti (KCK-221)
          required: true
