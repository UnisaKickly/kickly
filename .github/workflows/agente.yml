# =============================================================================
# Agente su richiesta (linee guida "Agentic Workflow", passo 12).
# Scrivi "@claude <richiesta>" in un commento di issue o PR, per esempio per
# correggere il piano o rispondere a un commento del revisore.
# Parte solo per commenti di OWNER, MEMBER o COLLABORATOR del repository:
# un utente esterno non puo' avviare un agente.
# =============================================================================
name: Agente su richiesta

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  agente:
    if: >-
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: agente-commento-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Senza "prompt" l'action risponde al commento che contiene @claude.
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: >-
            --max-turns 20
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(dart format:*),Bash(flutter analyze:*),Bash(flutter test:*),Bash(git:*)"
