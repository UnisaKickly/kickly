# =============================================================================
# CD - Rilascio continuo
# =============================================================================
# Gira a ogni push su `main`, cioe' quando ogni mercoledi' si fa il merge della
# release settimanale da `develop` a `main` (vedi CONTRIBUTING.md, sezione 5).
#
# Produce due cose:
#   1. la versione web dell'app pubblicata su GitHub Pages
#      (https://<organizzazione>.github.io/<repo>/), da mostrare alla demo;
#   2. un APK Android scaricabile dalla pagina del run (sezione "Artifacts"),
#      da installare sui telefoni per i test.
#
# Prerequisito (una volta sola, lo fanno i PM): Settings -> Pages ->
# Source = "GitHub Actions".
# =============================================================================
name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un solo deploy alla volta; un deploy in corso non viene interrotto a meta'.
concurrency:
  group: cd-pages
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.0"

jobs:
  build-web:
    name: Build web per GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Su GitHub Pages l'app non sta nella radice del dominio ma in
      # /<nome-repo>/: --base-href dice a Flutter dove trovare i suoi file.
      # URL e chiave publishable/anon di Supabase arrivano dai secret del
      # repository (Settings -> Secrets and variables -> Actions): senza, l'app
      # pubblicata mostrerebbe "Configurazione mancante" (vedi main.dart).
      # Passati via env e non interpolati nel comando, come in ci.yml.
      # La CI (ci.yml) invece resta senza chiavi: i test non le usano.
      - name: Compila l'app web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: >-
          flutter build web --release
          --base-href "/${{ github.event.repository.name }}/"
          --dart-define=SUPABASE_URL="$SUPABASE_URL"
          --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Prepara l'artifact per Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy-web:
    name: Pubblica su GitHub Pages
    needs: build-web
    runs-on: ubuntu-latest
    # Permessi minimi richiesti da GitHub Pages per pubblicare.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  build-android:
    name: Build APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Gradle (il sistema di build Android) richiede Java.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # APK firmato con la chiave di debug: va bene per installarlo sui
      # telefoni del team, NON per pubblicarlo sul Play Store.
      # Stessi secret della build web: l'APK si collega al progetto Supabase.
      - name: Compila l'APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: >-
          flutter build apk --release
          --dart-define=SUPABASE_URL="$SUPABASE_URL"
          --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Carica l'APK come artifact
        uses: actions/upload-artifact@v7
        with:
          name: kickly-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
