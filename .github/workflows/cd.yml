# =============================================================================
# CD - Rilascio continuo
# =============================================================================
# Gira a ogni push su `main`, cioe' quando ogni mercoledi' si fa il merge della
# release settimanale da `develop` a `main` (vedi CONTRIBUTING.md, sezione 5).
#
# Produce tre cose:
#   1. la versione web dell'app pubblicata su GitHub Pages
#      (https://<organizzazione>.github.io/<repo>/), da mostrare alla demo;
#   2. un APK Android scaricabile dalla pagina del run (sezione "Artifacts"),
#      da installare sui telefoni per i test;
#   3. una GitHub Release con lo stesso APK allegato: gli Artifacts scadono dopo
#      30 giorni, le Release no (serve per avere le build vecchie alla consegna).
#
# Prerequisiti (una volta sola, li fanno i PM):
#   - Settings -> Pages -> Source = "GitHub Actions";
#   - Settings -> Secrets and variables -> Actions -> Secrets: SUPABASE_URL e
#     SUPABASE_ANON_KEY (stessi valori del config.json locale). La chiave
#     service_role NON va mai messa qui. Se mancano, la build riesce lo stesso
#     ma l'app mostra "Configurazione mancante" (e il run mostra un avviso).
# =============================================================================
name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un solo deploy alla volta; un deploy in corso non viene interrotto a meta'.
concurrency:
  group: cd-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-web:
    name: Build web per GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # URL e chiave publishable/anon di Supabase arrivano dai secret del
    # repository. Passati via env e non interpolati nel comando, come in ci.yml.
    # La CI (ci.yml) invece resta senza chiavi: i test non le usano.
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v7

      - name: Prepara Flutter
        uses: ./.github/actions/setup-flutter

      - name: Controlla la configurazione di Supabase
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::Secret SUPABASE_URL / SUPABASE_ANON_KEY mancanti: l'app pubblicata mostrera' 'Configurazione mancante' (vedi main.dart e l'intestazione di cd.yml)."
          fi

      # Su GitHub Pages l'app non sta nella radice del dominio ma in
      # /<nome-repo>/: --base-href dice a Flutter dove trovare i suoi file.
      # --dart-define passa a Flutter la configurazione di Supabase (la stessa
      # che in locale arriva da --dart-define-from-file=config.json).
      - name: Compila l'app web
        run: >-
          flutter build web --release
          --base-href "/${{ github.event.repository.name }}/"
          --dart-define=SUPABASE_URL="$SUPABASE_URL"
          --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Prepara l'artifact per Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy-web:
    name: Pubblica su GitHub Pages
    needs: build-web
    runs-on: ubuntu-latest
    # Permessi minimi richiesti da GitHub Pages per pubblicare.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  build-android:
    name: Build APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Il permesso di scrittura serve SOLO per creare la GitHub Release (ultimo
    # passo); il resto del job non scrive nulla nel repository.
    permissions:
      contents: write
    # Stessi secret della build web: l'APK si collega al progetto Supabase.
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      # Gradle (il sistema di build Android) richiede Java.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepara Flutter
        uses: ./.github/actions/setup-flutter

      - name: Controlla la configurazione di Supabase
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::Secret SUPABASE_URL / SUPABASE_ANON_KEY mancanti: l'APK mostrera' 'Configurazione mancante' (vedi l'intestazione di cd.yml)."
          fi

      # APK firmato con la chiave di debug: va bene per installarlo sui
      # telefoni del team, NON per pubblicarlo sul Play Store.
      # --build-number: il "versionCode" di Android cresce a ogni run, cosi'
      # un APK nuovo si installa sopra quello vecchio senza disinstallare.
      - name: Compila l'APK
        run: >-
          flutter build apk --release
          --build-number="${{ github.run_number }}"
          --dart-define=SUPABASE_URL="$SUPABASE_URL"
          --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Carica l'APK come artifact
        uses: actions/upload-artifact@v7
        with:
          name: kickly-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # GitHub Release (marcata "pre-release": l'APK e' firmato con la chiave
      # di debug) con l'APK allegato. Il tag e' <versione del pubspec>-build.<n>,
      # es. v0.1.0-build.7. Se fallisce (es. regole sui tag) NON deve far
      # fallire la CD: l'APK e' gia' disponibile tra gli Artifacts.
      - name: Crea la GitHub Release con l'APK
        continue-on-error: true
        run: |
          version=$(grep '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//; s/\+.*//')
          tag="v${version}-build.${{ github.run_number }}"
          cp build/app/outputs/flutter-apk/app-release.apk "kickly-${tag}.apk"
          gh release create "$tag" "kickly-${tag}.apk" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Kickly ${tag}" \
            --notes "Build automatica della CD dal commit ${GITHUB_SHA}. APK firmato con la chiave di debug: solo per i test del team."
