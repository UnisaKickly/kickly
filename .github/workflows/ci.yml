# =============================================================================
# CI - Integrazione continua
# =============================================================================
# Gira su OGNI pull request verso `develop` o `main` e su ogni push su quei
# branch. Una PR si puo' fare merge solo se questo workflow e' verde
# (regola impostata nella branch protection di GitHub).
#
# Cosa controlla, in ordine:
#   1. formattazione del codice (dart format)
#   2. analisi statica (flutter analyze, regole in analysis_options.yaml)
#   3. test automatici con misura della coverage (flutter test --coverage)
#   4. che l'app compili davvero (build web)
#
# Se la CI fallisce: aprite il job rosso nella tab "Checks" della PR, leggete
# l'errore, correggete in locale (stessi comandi riportati sotto) e fate un
# nuovo push sullo stesso branch: la CI ripartira' da sola.
# =============================================================================
name: CI

on:
  pull_request:
    branches: [develop, main]
    # ready_for_review: la CI riparte quando una PR in bozza (Draft) viene
    # segnata pronta, cosi' la revisione parte sempre da un esito aggiornato.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [develop, main]
  # Permette di rilanciare la CI a mano dalla tab "Actions".
  workflow_dispatch:

# Se fate due push di fila sulla stessa PR, il run vecchio viene annullato:
# inutile sprecare minuti di CI su un commit gia' superato.
# Sui push in `develop`/`main` NON si annulla nulla: ogni commit che entra nei
# branch condivisi deve avere il suo esito completo (serve anche a capire quale
# commit ha rotto la build).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Il workflow legge solo il codice: nessun permesso di scrittura.
permissions:
  contents: read

# La versione di Flutter e' fissata in un solo posto: l'azione composita
# .github/actions/setup-flutter (tutti, CI e team, devono usare la stessa,
# altrimenti formattazione e lint possono dare risultati diversi).

jobs:
  # Controlla che il branch della PR rispetti la regola del progetto
  # (CONTRIBUTING.md, sezione 1): <tipo>/KCK-<numero>-<quello che vuoi>.
  # La chiave Jira nel nome serve a GitHub for Atlassian per collegare
  # branch, commit e PR al ticket. Sui push (non PR) il job viene saltato.
  branch-name:
    name: Nome del branch
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verifica il nome del branch
        env:
          # Passato via env e non interpolato nello script: il nome del branch
          # e' scelto da chi apre la PR, quindi non e' un input fidato.
          BRANCH: ${{ github.head_ref }}
          # Anche il titolo e' scelto da chi apre la PR: passato via env.
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Eccezioni: la PR di release settimanale (develop -> main) e le PR
          # automatiche di Dependabot.
          if [ "$BRANCH" = "develop" ] || [[ "$BRANCH" == dependabot/* ]]; then
            echo "Branch '$BRANCH': eccezione ammessa."
            exit 0
          fi
          # Branch creati dagli assistenti IA collegati a GitHub (Codex, Claude,
          # Copilot): il nome lo sceglie l'IA, quindi la chiave Jira deve stare
          # all'inizio del TITOLO della PR ("KCK-<n>: ..."). GitHub for Atlassian
          # collega la PR al ticket anche dal titolo.
          if [[ "$BRANCH" =~ ^(codex|claude|copilot)/ ]]; then
            if [[ "$TITLE" =~ ^KCK-[0-9]+:\  ]]; then
              echo "Branch '$BRANCH' creato da un'IA, titolo con la chiave Jira: ammesso."
              exit 0
            fi
            echo "::error::Il branch '$BRANCH' e' stato creato da un'IA: il titolo della PR deve iniziare con la chiave Jira, es. 'KCK-235: crea partita'. Correggi il titolo, poi chiudi e riapri la PR (Close / Reopen) oppure fai un nuovo push: il Re-run usa il titolo vecchio."
            exit 1
          fi
          # Tipo + chiave Jira obbligatori; dopo la chiave, un separatore e
          # poi qualsiasi descrizione (oppure niente).
          if [[ "$BRANCH" =~ ^(feature|fix|chore|docs)/KCK-[0-9]+([-_].*)?$ ]]; then
            echo "Branch '$BRANCH': nome valido."
          else
            echo "::error::Il branch '$BRANCH' non rispetta la regola <tipo>/KCK-<numero>-<descrizione> (tipo: feature, fix, chore, docs), oppure un branch codex/, claude/ o copilot/ con il titolo della PR che inizia con 'KCK-<n>: '. Vedi CONTRIBUTING.md, sezione 1, e la sezione 7 per rinominarlo."
            exit 1
          fi

  # Controlli sul lavoro con gli agenti (linee guida "Agentic Workflow"):
  #  1. DG9 dell'SDD: nessun SDK di Supabase/FCM/Stripe nei livelli Presentation
  #     e Domain (solo il livello Data e lib/core possono usarli). Fallisce la PR.
  #  2. Avviso (non blocca) se la PR modifica o cancella test GIA' esistenti:
  #     e' il segnale tipico di un agente che "aggiusta" i test per farli passare.
  agentic-checks:
    name: Controlli DG9 e test modificati
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # Serve la storia per confrontare il branch con la base della PR.
          fetch-depth: 0

      - name: DG9 - nessun SDK esterno in presentation/domain
        run: |
          # Se la cartella non esiste ancora (prima dell'EN-1) il controllo passa.
          dirs=$(find lib/features -type d \( -name presentation -o -name domain \) 2>/dev/null || true)
          if [ -z "$dirs" ]; then echo "Nessuna cartella presentation/domain: niente da controllare."; exit 0; fi
          # shellcheck disable=SC2086
          # Oltre a supabase_flutter, i sotto-pacchetti del client Supabase
          # (gotrue, postgrest, ...) hanno gli stessi vincoli.
          if grep -rnE "package:(supabase_flutter|supabase|gotrue|postgrest|realtime_client|storage_client|functions_client|firebase_[a-z_]+|flutter_stripe)/" $dirs; then
            echo "::error::DG9 violato: SDK esterni importati in presentation/domain. Usa un Repository nel livello data (vedi AGENTS.md)."
            exit 1
          fi
          echo "DG9 rispettato."

      - name: Avviso su test esistenti modificati
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          # M = modificato, D = cancellato, R = rinominato (A = nuovo, ok).
          changed=$(git diff --name-status "origin/$BASE...HEAD" -- test | grep -E '^(M|D|R)' || true)
          if [ -n "$changed" ]; then
            echo "::warning::Questa PR modifica o cancella test esistenti. Spiega il motivo nel template della PR."
            echo "$changed"
          else
            echo "Nessun test esistente modificato."
          fi

      # Avviso (non blocca) se la PR cambia le dipendenze: ogni libreria nuova va
      # approvata da un PM (esiste davvero? e' mantenuta? licenza compatibile?).
      - name: Avviso su dipendenze modificate
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if git diff --quiet "origin/$BASE...HEAD" -- pubspec.yaml; then
            echo "Nessuna dipendenza modificata."
          else
            echo "::warning::Questa PR modifica pubspec.yaml: le nuove dipendenze vanno approvate da un PM (vedi AGENTS.md)."
            git diff "origin/$BASE...HEAD" -- pubspec.yaml
          fi

      # Tabella "test frame -> test" nel riepilogo del run (non blocca):
      # mostra quali frame della category partition non hanno ancora un test.
      - name: Tracciabilita' test frame
        run: bash scripts/tracciabilita.sh >> "$GITHUB_STEP_SUMMARY"

  analyze-and-test:
    name: Formattazione, analisi e test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v7

      # Installa Flutter (versione fissata) e fa `flutter pub get`.
      - name: Prepara Flutter
        uses: ./.github/actions/setup-flutter

      # In locale: `dart format .` (corregge da solo i file).
      - name: Controlla la formattazione
        run: dart format --output=none --set-exit-if-changed .

      # In locale: `flutter analyze`.
      - name: Analisi statica
        run: flutter analyze

      # In locale: `flutter test --coverage`.
      - name: Test con coverage
        run: flutter test --coverage

      # Calcola la percentuale di righe coperte dai test leggendo lcov.info
      # (LF = righe trovate, LH = righe eseguite) e la scrive nel riepilogo
      # del run, visibile nella pagina del workflow su GitHub.
      # Attenzione: `flutter test --coverage` conta SOLO i file che i test
      # importano (direttamente o indirettamente). Un file mai importato da un
      # test non compare nel totale e la percentuale risulta piu' alta del vero.
      - name: Riepilogo coverage
        run: |
          if [ -f coverage/lcov.info ]; then
            awk -F: '/^LF:/ {lf+=$2} /^LH:/ {lh+=$2}
              END { pct = (lf > 0) ? lh*100/lf : 0;
                    printf "### Coverage dei test: %.1f%% (%d/%d righe)\n", pct, lh, lf }' \
              coverage/lcov.info >> "$GITHUB_STEP_SUMMARY"
            echo "_Conta solo i file importati dai test: i file mai importati non compaiono nel totale._" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Salva il report di coverage come artifact scaricabile (utile per il
      # Test Summary Report).
      - name: Carica il report di coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore

  build-web:
    name: Build web
    # Parte solo se analisi e test sono passati: inutile compilare codice
    # che non supera i controlli.
    needs: analyze-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Prepara Flutter
        uses: ./.github/actions/setup-flutter

      # Verifica che l'app compili in modalita' release.
      - name: Compila l'app web
        run: flutter build web --release

  # Compila anche l'app Android: senza questo job l'Android verrebbe compilato
  # per la prima volta dal CD, il mercoledi' dopo il merge in `main`, e un
  # plugin con requisiti Android (minSdk, Kotlin, Gradle) romperebbe il rilascio
  # invece di una PR. Gira sui push in `develop`/`main` e a mano (non sulle PR:
  # costa piu' del web e la PR di release aperta dal bot non lancia la CI).
  # NON e' un controllo obbligatorio: se diventa rosso lo si vede in `develop`.
  build-android:
    name: Build Android (debug)
    needs: analyze-and-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Gradle (il sistema di build Android) richiede Java.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepara Flutter
        uses: ./.github/actions/setup-flutter

      # APK di debug: serve solo a verificare che Gradle compili.
      - name: Compila l'APK di debug
        run: flutter build apk --debug

  # Rileva se il lavoro ha toccato `supabase/` (database ed Edge Functions).
  # Il job `supabase` qui sotto parte solo in quel caso. Si usa un job con un
  # `if:` e NON `paths:` sul trigger: un controllo che non parte mai lascerebbe
  # una PR in attesa per sempre se un giorno venisse reso obbligatorio, mentre un
  # job "skipped" conta come superato.
  changes:
    name: Rileva modifiche a supabase/
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      supabase: ${{ steps.filtro.outputs.supabase }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Confronta con la base
        id: filtro
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          # Nel dubbio (push iniziale, esecuzione a mano, storia non
          # disponibile) si esegue il job: meglio un controllo in piu' che uno
          # saltato per errore.
          run=true
          if [ "$EVENT" = "pull_request" ]; then
            if git diff --quiet "origin/$BASE_REF...HEAD" -- supabase; then run=false; fi
          elif [ "$EVENT" = "push" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            if git diff --quiet "$BEFORE" HEAD -- supabase; then run=false; fi
          fi
          echo "Modifiche in supabase/ da controllare: $run"
          echo "supabase=$run" >> "$GITHUB_OUTPUT"

  # Controlli su database ed Edge Functions (AGENTS.md: `supabase test db` e
  # `deno test` quando si tocca `supabase/`). Niente di cio' esiste ancora
  # (c'e' solo config.toml): i passi si attivano da soli quando compaiono
  # migration, test pgTAP ed Edge Functions. NON e' un controllo obbligatorio
  # finche' i PM non lo aggiungono alla regola del ruleset.
  supabase:
    name: Supabase e Edge Functions
    needs: changes
    if: needs.changes.outputs.supabase == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Serve la storia completa per confrontare le migration della PR con
          # quelle gia' presenti nel branch di destinazione (passo qui sotto).
          fetch-depth: 0

      # Regole sulle migration (KCK-269), solo sulle PR. Dal merge in `develop`
      # il workflow db-deploy.yml le applica al database vero, quindi un errore
      # qui evita un deploy rosso dopo il merge:
      #   - il nome del file e' `AAAAMMGGHHMMSS_nome.sql` (lo crea
      #     `supabase migration new`: il prefisso e' la data e l'ora UTC);
      #   - ogni migration NUOVA ha un timestamp piu' recente di tutte quelle
      #     gia' nel branch di destinazione: altrimenti la CLI si rifiuta di
      #     applicarla (e' il caso di una PR rimasta aperta a lungo);
      #   - le migration GIA' nel branch non si modificano, rinominano o
      #     cancellano: sono gia' state applicate al DB, una correzione si fa
      #     con una migration nuova.
      - name: Controlla le regole sulle migration
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          base="origin/$BASE_REF"

          # Timestamp piu' recente tra le migration gia' nel branch di
          # destinazione ("0" se non ce n'e' ancora nessuna).
          ultima=$(git ls-tree -r --name-only "$base" -- supabase/migrations \
            | sed 's#.*/##' | grep -oE '^[0-9]{14}' | sort | tail -1 || true)
          ultima=${ultima:-0}
          echo "Ultima migration gia' in $BASE_REF: $ultima"

          errori=0
          # Solo le modifiche della PR (tre punti: dal punto di partenza del
          # branch). Il separatore e' il tab; per i rename ci sono due percorsi.
          while IFS=$'\t' read -r stato percorso nuovo; do
            [ -z "$stato" ] && continue
            case "$stato" in
              A)
                nome=$(basename "$percorso")
                if ! echo "$nome" | grep -qE '^[0-9]{14}_[a-z0-9_]+\.sql$'; then
                  echo "::error file=$percorso::Nome non valido: usa 'supabase migration new <nome>' (formato AAAAMMGGHHMMSS_nome.sql, minuscolo)."
                  errori=1
                  continue
                fi
                ts=${nome:0:14}
                if [[ ! "$ts" > "$ultima" ]]; then
                  echo "::error file=$percorso::Il timestamp $ts non e' successivo all'ultima migration gia' in $BASE_REF ($ultima): la CLI la rifiuterebbe al deploy. Rinomina il file con un timestamp nuovo (crea un file con 'supabase migration new' e copiaci il contenuto)."
                  errori=1
                fi
                ;;
              M|D|R*)
                echo "::error file=$percorso::Una migration gia' in $BASE_REF non si modifica, rinomina o cancella (stato $stato): e' gia' stata applicata al database. Scrivi una migration nuova per la correzione."
                errori=1
                ;;
            esac
          done < <(git diff --name-status "$base...HEAD" -- supabase/migrations)

          if [ "$errori" -ne 0 ]; then
            exit 1
          fi
          echo "Migration della PR in regola."

      - name: Controlla cosa c'e' da verificare
        id: cosa
        run: |
          [ -n "$(ls supabase/migrations/*.sql 2>/dev/null)" ] && echo "db=true" >> "$GITHUB_OUTPUT" || echo "db=false" >> "$GITHUB_OUTPUT"
          [ -n "$(ls supabase/tests/*.sql supabase/tests/**/*.sql 2>/dev/null)" ] && echo "pgtap=true" >> "$GITHUB_OUTPUT" || echo "pgtap=false" >> "$GITHUB_OUTPUT"
          [ -n "$(find supabase/functions -name '*.ts' 2>/dev/null | head -1)" ] && echo "deno=true" >> "$GITHUB_OUTPUT" || echo "deno=false" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      # Database: applica tutte le migration su un Postgres locale e lancia i
      # test pgTAP (RLS comprese).
      # Versione fissata, la stessa di db-deploy.yml, e non `latest`: la 3.x ha
      # cambiato in silenzio il comportamento di `db push` (senza `--remote`
      # punta al DB locale), un salto di versione non deve cambiare la CI senza
      # che ce ne accorgiamo. Per aggiornarla si cambia in entrambi i workflow.
      - name: Installa la CLI di Supabase
        if: steps.cosa.outputs.db == 'true'
        uses: supabase/setup-cli@v3
        with:
          version: 3.2.0

      - name: Avvia Supabase in locale e applica le migration
        if: steps.cosa.outputs.db == 'true'
        run: |
          supabase start
          supabase db reset

      - name: Test del database
        if: steps.cosa.outputs.db == 'true' && steps.cosa.outputs.pgtap == 'true'
        run: supabase test db

      # Edge Functions (TypeScript/Deno).
      - name: Installa Deno
        if: steps.cosa.outputs.deno == 'true'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Un `deno test` per ogni funzione (come in AGENTS.md), saltando le
      # cartelle di codice condiviso che iniziano con "_" (es. `_shared`).
      # `--permit-no-files` (e non `--permit-no-tests`, che Deno 2 non conosce)
      # evita il fallimento per una funzione ancora senza file di test (KCK-273).
      - name: Test delle Edge Functions
        if: steps.cosa.outputs.deno == 'true'
        run: |
          for dir in supabase/functions/*/; do
            case "$(basename "$dir")" in _*) continue ;; esac
            echo "::group::deno test $dir"
            deno test --permit-no-files --allow-env --allow-net "$dir"
            echo "::endgroup::"
          done
