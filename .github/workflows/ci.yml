# =============================================================================
# CI - Integrazione continua
# =============================================================================
# Gira su OGNI pull request verso `develop` o `main` e su ogni push su quei
# branch. Una PR si puo' fare merge solo se questo workflow e' verde
# (regola impostata nella branch protection di GitHub).
#
# Cosa controlla, in ordine:
#   1. formattazione del codice (dart format)
#   2. analisi statica (flutter analyze, regole in analysis_options.yaml)
#   3. test automatici con misura della coverage (flutter test --coverage)
#   4. che l'app compili davvero (build web)
#
# Se la CI fallisce: aprite il job rosso nella tab "Checks" della PR, leggete
# l'errore, correggete in locale (stessi comandi riportati sotto) e fate un
# nuovo push sullo stesso branch: la CI ripartira' da sola.
# =============================================================================
name: CI

on:
  pull_request:
    branches: [develop, main]
    # ready_for_review: la CI riparte quando una PR in bozza (Draft) viene
    # segnata pronta, cosi' la revisione parte sempre da un esito aggiornato.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [develop, main]
  # Permette di rilanciare la CI a mano dalla tab "Actions".
  workflow_dispatch:

# Se fate due push di fila sulla stessa PR, il run vecchio viene annullato:
# inutile sprecare minuti di CI su un commit gia' superato.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Il workflow legge solo il codice: nessun permesso di scrittura.
permissions:
  contents: read

env:
  # Versione di Flutter fissata: tutti (CI e team) devono usare la stessa,
  # altrimenti formattazione e lint possono dare risultati diversi.
  FLUTTER_VERSION: "3.47.0"

jobs:
  # Controlla che il branch della PR rispetti la regola del progetto
  # (CONTRIBUTING.md, sezione 1): <tipo>/KCK-<numero>-<quello che vuoi>.
  # La chiave Jira nel nome serve a GitHub for Atlassian per collegare
  # branch, commit e PR al ticket. Sui push (non PR) il job viene saltato.
  branch-name:
    name: Nome del branch
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verifica il nome del branch
        env:
          # Passato via env e non interpolato nello script: il nome del branch
          # e' scelto da chi apre la PR, quindi non e' un input fidato.
          BRANCH: ${{ github.head_ref }}
          # Anche il titolo e' scelto da chi apre la PR: passato via env.
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Eccezioni: la PR di release settimanale (develop -> main) e le PR
          # automatiche di Dependabot.
          if [ "$BRANCH" = "develop" ] || [[ "$BRANCH" == dependabot/* ]]; then
            echo "Branch '$BRANCH': eccezione ammessa."
            exit 0
          fi
          # Branch creati dagli assistenti IA collegati a GitHub (Codex, Claude,
          # Copilot): il nome lo sceglie l'IA, quindi la chiave Jira deve stare
          # all'inizio del TITOLO della PR ("KCK-<n>: ..."). GitHub for Atlassian
          # collega la PR al ticket anche dal titolo.
          if [[ "$BRANCH" =~ ^(codex|claude|copilot)/ ]]; then
            if [[ "$TITLE" =~ ^KCK-[0-9]+:\  ]]; then
              echo "Branch '$BRANCH' creato da un'IA, titolo con la chiave Jira: ammesso."
              exit 0
            fi
            echo "::error::Il branch '$BRANCH' e' stato creato da un'IA: il titolo della PR deve iniziare con la chiave Jira, es. 'KCK-235: crea partita'. Correggi il titolo, poi chiudi e riapri la PR (Close / Reopen) oppure fai un nuovo push: il Re-run usa il titolo vecchio."
            exit 1
          fi
          # Tipo + chiave Jira obbligatori; dopo la chiave, un separatore e
          # poi qualsiasi descrizione (oppure niente).
          if [[ "$BRANCH" =~ ^(feature|fix|chore|docs)/KCK-[0-9]+([-_].*)?$ ]]; then
            echo "Branch '$BRANCH': nome valido."
          else
            echo "::error::Il branch '$BRANCH' non rispetta la regola <tipo>/KCK-<numero>-<descrizione> (tipo: feature, fix, chore, docs), oppure un branch codex/, claude/ o copilot/ con il titolo della PR che inizia con 'KCK-<n>: '. Vedi CONTRIBUTING.md, sezione 1, e la sezione 7 per rinominarlo."
            exit 1
          fi

  # Controlli sul lavoro con gli agenti (linee guida "Agentic Workflow"):
  #  1. DG9 dell'SDD: nessun SDK di Supabase/FCM/Stripe nei livelli Presentation
  #     e Domain (solo il livello Data e lib/core possono usarli). Fallisce la PR.
  #  2. Avviso (non blocca) se la PR modifica o cancella test GIA' esistenti:
  #     e' il segnale tipico di un agente che "aggiusta" i test per farli passare.
  agentic-checks:
    name: Controlli DG9 e test modificati
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # Serve la storia per confrontare il branch con la base della PR.
          fetch-depth: 0

      - name: DG9 - nessun SDK esterno in presentation/domain
        run: |
          # Se la cartella non esiste ancora (prima dell'EN-1) il controllo passa.
          dirs=$(find lib/features -type d \( -name presentation -o -name domain \) 2>/dev/null || true)
          if [ -z "$dirs" ]; then echo "Nessuna cartella presentation/domain: niente da controllare."; exit 0; fi
          # shellcheck disable=SC2086
          if grep -rnE "package:(supabase_flutter|supabase|firebase_[a-z_]+|flutter_stripe)/" $dirs; then
            echo "::error::DG9 violato: SDK esterni importati in presentation/domain. Usa un Repository nel livello data (vedi AGENTS.md)."
            exit 1
          fi
          echo "DG9 rispettato."

      - name: Avviso su test esistenti modificati
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          # M = modificato, D = cancellato, R = rinominato (A = nuovo, ok).
          changed=$(git diff --name-status "origin/$BASE...HEAD" -- test | grep -E '^(M|D|R)' || true)
          if [ -n "$changed" ]; then
            echo "::warning::Questa PR modifica o cancella test esistenti. Spiega il motivo nel template della PR."
            echo "$changed"
          else
            echo "Nessun test esistente modificato."
          fi

      # Avviso (non blocca) se la PR cambia le dipendenze: ogni libreria nuova va
      # approvata da un PM (esiste davvero? e' mantenuta? licenza compatibile?).
      - name: Avviso su dipendenze modificate
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if git diff --quiet "origin/$BASE...HEAD" -- pubspec.yaml; then
            echo "Nessuna dipendenza modificata."
          else
            echo "::warning::Questa PR modifica pubspec.yaml: le nuove dipendenze vanno approvate da un PM (vedi AGENTS.md)."
            git diff "origin/$BASE...HEAD" -- pubspec.yaml
          fi

      # Tabella "test frame -> test" nel riepilogo del run (non blocca):
      # mostra quali frame della category partition non hanno ancora un test.
      - name: Tracciabilita' test frame
        run: bash scripts/tracciabilita.sh >> "$GITHUB_STEP_SUMMARY"

  analyze-and-test:
    name: Formattazione, analisi e test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v7

      - name: Installa Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          # Cache dell'SDK e dei pacchetti: le run successive sono piu' veloci.
          cache: true

      - name: Scarica le dipendenze
        run: flutter pub get

      # In locale: `dart format .` (corregge da solo i file).
      - name: Controlla la formattazione
        run: dart format --output=none --set-exit-if-changed .

      # In locale: `flutter analyze`.
      - name: Analisi statica
        run: flutter analyze

      # In locale: `flutter test --coverage`.
      - name: Test con coverage
        run: flutter test --coverage

      # Calcola la percentuale di righe coperte dai test leggendo lcov.info
      # (LF = righe trovate, LH = righe eseguite) e la scrive nel riepilogo
      # del run, visibile nella pagina del workflow su GitHub.
      - name: Riepilogo coverage
        run: |
          if [ -f coverage/lcov.info ]; then
            awk -F: '/^LF:/ {lf+=$2} /^LH:/ {lh+=$2}
              END { pct = (lf > 0) ? lh*100/lf : 0;
                    printf "### Coverage dei test: %.1f%% (%d/%d righe)\n", pct, lh, lf }' \
              coverage/lcov.info >> "$GITHUB_STEP_SUMMARY"
          fi

      # Salva il report di coverage come artifact scaricabile (utile per il
      # Test Summary Report).
      - name: Carica il report di coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore

  build-web:
    name: Build web
    # Parte solo se analisi e test sono passati: inutile compilare codice
    # che non supera i controlli.
    needs: analyze-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Verifica che l'app compili in modalita' release.
      - name: Compila l'app web
        run: flutter build web --release
