# =============================================================================
# Deploy Supabase - applica migration ed Edge Functions al progetto Supabase
# =============================================================================
# La CI (ci.yml) prova le migration su un Postgres locale usa e getta e testa le
# Edge Functions con Deno, ma non tocca mai il progetto vero. Questo workflow le
# pubblica sul progetto Supabase collegato, cosi' database e funzioni restano
# allineati al codice mergiato (ticket KCK-268 per il DB, KCK-269 per le funzioni).
#
# Quando gira:
#   - a ogni push su `develop` che modifica `supabase/migrations/**` oppure
#     `supabase/functions/**` (cioe' quando una PR viene mergiata): applica;
#   - a mano da Actions -> "Deploy Supabase" -> Run workflow: di default fa
#     solo l'ANTEPRIMA (elenca le migration da applicare e le funzioni da
#     pubblicare, non tocca niente); spuntando "applica" fa il deploy vero.
#     Serve per provare la configurazione e per rilanciare se un deploy e' caduto.
#
# Cosa fa, in ordine: `supabase link`, anteprima (`db push --dry-run`) e, se
# deve applicare, `db push`; poi, se ci sono Edge Functions, `functions deploy`.
# Le funzioni vanno DOPO le migration: una funzione puo' usare tabelle nuove, e
# se una migration fallisce il job si ferma prima di pubblicare codice che ne
# dipende. Non usa MAI `--include-seed` (i dati finti restano solo nel DB
# locale), ne' `db reset` (cancellerebbe il database remoto), ne' `--prune`
# (cancellerebbe le funzioni del progetto che non sono nel repository).
#
# Le Edge Functions si pubblicano tutte insieme (sono poche). Il controllo del
# JWT e' attivo di default: per una funzione che deve essere pubblica (es. il
# webhook di Stripe, che si autentica con la sua firma) si scrive
# `[functions.<nome>] verify_jwt = false` in `supabase/config.toml`, funzione
# per funzione. I SECRET delle funzioni (es. la chiave segreta di Stripe) NON
# passano da qui: si impostano a mano con `supabase secrets set` o dal
# dashboard di Supabase, mai nel repository ne' in questo workflow.
#
# Un solo database: il progetto Supabase e' uno solo (il piano gratuito non
# permette un secondo progetto ne' il branching), quindi `develop` e `main`
# condividono lo stesso DB e lo aggiorna solo `develop`: la release del
# mercoledi' non ha nessun passo sul database.
#
# Dove stanno le credenziali (le configurano i PM, una volta sola):
#   Settings -> Environments -> `supabase-develop`, con Deployment branches =
#   solo `develop`, e dentro:
#     - Secret   SUPABASE_ACCESS_TOKEN: token personale Supabase. Se e' un
#                token a permessi limitati servono `database_write`,
#                `projects_read`, `database_pooling_config_read` e, per le
#                funzioni, `edge_functions_write`;
#     - Variable SUPABASE_PROJECT_REF:  l'id del progetto (nell'URL del dashboard).
#   I valori stanno nell'environment e non nei secret di repository di
#   proposito: con la restrizione sui branch, chi apre una PR da un suo branch
#   (anche modificando questo file) non puo' leggerli.
#
# Se un deploy fallisce con un messaggio sulle migration "inserite prima
# dell'ultima": una migration ha un timestamp precedente a quelle gia' sul DB.
# Non si forza niente: si rinomina il file con `supabase migration new` (data
# e ora attuali) in una nuova PR. Vedi README, sezione "Migration sul database".
# =============================================================================
name: Deploy Supabase

on:
  push:
    branches: [develop]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
  workflow_dispatch:
    inputs:
      applica:
        description: "Applica davvero migration e funzioni (se non e' spuntato fa solo l'anteprima)"
        type: boolean
        default: false

# Un solo deploy alla volta e mai interrotto a meta': due deploy in parallelo,
# o fermati a meta', lascerebbero database e funzioni in uno stato difficile da
# capire.
concurrency:
  group: db-deploy
  cancel-in-progress: false

# Il workflow legge solo il codice: nessun permesso di scrittura sul repository.
permissions:
  contents: read

jobs:
  deploy-db:
    name: Applica migration e funzioni su Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Token e progetto vengono dall'environment, che accetta solo il branch
    # `develop`: lanciato a mano da un altro branch il job non parte.
    environment: supabase-develop
    # Token e progetto arrivano via env e non vengono scritti nei comandi:
    # cosi' non finiscono nel log. Il riferimento al progetto accetta sia una
    # Variable sia un Secret, per non far sbagliare chi li crea.
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF }}
      # Sui push si applica sempre; a mano solo se si spunta "applica".
      APPLICA: ${{ github.event_name == 'push' || inputs.applica }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Il token di GitHub non resta salvato in .git/config.
          persist-credentials: false

      # Come cd.yml: se i valori mancano non e' un errore del codice, quindi il
      # job avvisa e finisce senza far diventare rosso il branch.
      - name: Controlla la configurazione
        id: config
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::warning::Manca SUPABASE_ACCESS_TOKEN o SUPABASE_PROJECT_REF nell'environment: nessuna migration applicata. Vedi l'intestazione di db-deploy.yml."
            echo "pronto=false" >> "$GITHUB_OUTPUT"
          else
            echo "pronto=true" >> "$GITHUB_OUTPUT"
          fi

      # Versione fissata di proposito (non `latest`): dalla 3.x `db push` senza
      # `--remote` punta al database locale, una modifica silenziosa come questa
      # non deve cambiare il comportamento del deploy senza che ce ne accorgiamo.
      - name: Installa la CLI di Supabase
        if: steps.config.outputs.pronto == 'true'
        uses: supabase/setup-cli@v3
        with:
          version: 3.2.0

      - name: Collega il progetto, mostra l'anteprima e applica
        if: steps.config.outputs.pronto == 'true'
        run: |
          set -euo pipefail

          # La connessione al database a volte cade ("Connection terminated"):
          # si riprova fino a 3 volte prima di dichiarare il deploy fallito.
          riprova() {
            local n=1
            until "$@"; do
              if [ "$n" -ge 3 ]; then
                echo "::error::Comando fallito dopo 3 tentativi: $1 $2 $3"
                return 1
              fi
              echo "::warning::Tentativo $n fallito, riprovo tra 10 secondi."
              n=$((n + 1))
              sleep 10
            done
          }

          riprova supabase link --project-ref "$SUPABASE_PROJECT_REF"

          # Anteprima: stampa le migration da applicare e non modifica il DB.
          # Se una migration ha un timestamp piu' vecchio di quelle gia'
          # applicate la CLI di norma si rifiuta di procedere: il job diventa
          # rosso e non si applica niente (non si forza con --include-all).
          riprova supabase db push --remote --dry-run

          if [ "$APPLICA" = "true" ]; then
            # `--yes` e' richiesto dalla CLI per modificare un DB remoto senza
            # una persona che risponda alla conferma.
            riprova supabase db push --remote --yes
          else
            echo "Solo anteprima: per applicare rilancia il workflow spuntando 'applica'."
          fi

      # Edge Functions (TypeScript/Deno): una cartella per funzione in
      # `supabase/functions/<nome>/index.ts`. Le cartelle che iniziano con "_"
      # (es. `_shared`) sono codice condiviso, non funzioni. Se non ce ne sono
      # (oggi e' cosi') il passo non fa niente.
      # `--use-api` impacchetta le funzioni lato Supabase, senza Docker.
      - name: Pubblica le Edge Functions
        if: steps.config.outputs.pronto == 'true'
        run: |
          set -euo pipefail

          riprova() {
            local n=1
            until "$@"; do
              if [ "$n" -ge 3 ]; then
                echo "::error::Comando fallito dopo 3 tentativi: $1 $2 $3"
                return 1
              fi
              echo "::warning::Tentativo $n fallito, riprovo tra 10 secondi."
              n=$((n + 1))
              sleep 10
            done
          }

          funzioni=$(find supabase/functions -mindepth 2 -maxdepth 2 -name index.ts \
            -not -path 'supabase/functions/_*' 2>/dev/null \
            | sed -E 's#supabase/functions/([^/]+)/index.ts#\1#' | sort || true)

          if [ -z "$funzioni" ]; then
            echo "Nessuna Edge Function da pubblicare."
            exit 0
          fi

          echo "Edge Functions nel repository:"
          echo "$funzioni" | sed 's/^/  - /'

          if [ "$APPLICA" = "true" ]; then
            riprova supabase functions deploy --use-api --yes
          else
            echo "Solo anteprima: per pubblicarle rilancia il workflow spuntando 'applica'."
          fi

      # Controllo finale, in sola lettura: per ogni migration locale mostra se
      # e' presente anche sul DB remoto (colonna "remote" non vuota). Le
      # funzioni pubblicate si vedono nel dashboard di Supabase -> Edge Functions.
      - name: Mostra lo stato delle migration
        if: steps.config.outputs.pronto == 'true'
        run: |
          set -euo pipefail
          for tentativo in 1 2 3; do
            if supabase migration list --remote; then
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Non sono riuscito a leggere lo stato finale delle migration."
