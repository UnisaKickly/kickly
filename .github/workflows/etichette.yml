# =============================================================================
# Crea (o aggiorna) le label della pipeline con gli agenti. Si lancia UNA volta
# a mano dalla tab Actions -> "Crea le label della pipeline" -> Run workflow.
# Linee guida "Agentic Workflow", passo 3: aggiungere una label e' il comando
# con cui una persona fa partire la fase successiva.
# =============================================================================
name: Crea le label della pipeline

on: workflow_dispatch

permissions:
  issues: write

jobs:
  etichette:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Crea le label
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # --force aggiorna colore e descrizione se la label esiste gia'.
          gh label create task-agente          --color 0E8A16 --description "Task svolto con agenti" --force
          gh label create fase:piano           --color FBCA04 --description "Avvia l'agente pianificatore" --force
          gh label create fase:implementazione --color 1D76DB --description "Piano approvato: avvia l'implementazione" --force
          gh label create fase:test            --color 5319E7 --description "Avvia l'agente tester sulla PR" --force
          gh label create bug                  --color D73A4A --description "Difetto: l'agente parte dal test che fallisce" --force
          gh label create prova                --color C5DEF5 --description "Prova della pipeline (workflow Saluto)" --force
          gh label list
