# =============================================================================
# Workflow di prova (linee guida "Agentic Workflow", passo 8): aggiungi la label
# "prova" a un'issue qualsiasi; se compare il commento, eventi, condizioni e
# permessi funzionano. Non usa agenti ne' secret.
# =============================================================================
name: Saluto

on:
  issues:
    types: [labeled]

jobs:
  saluta:
    if: github.event.label.name == 'prova'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      issues: write
    steps:
      - run: gh issue comment "$NUM" --body "Ciao! La pipeline risponde alle label."
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUM: ${{ github.event.issue.number }}
